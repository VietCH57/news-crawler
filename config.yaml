# Cấu hình crawler. Đường dẫn tương đối tính từ thư mục chứa file này.

# Ghi tên dự án và link repo để quản trị các báo biết ai đang truy cập.
# Không dùng User-Agent mặc định của thư viện (robots.txt của VnExpress chặn "Scrapy").
user_agent: "news-crawler/0.1 (+https://github.com/VietCH57/news-crawler; student project)"

data_dir: data

rss_interval_seconds: 300          # feed đầu tiên (tin mới nhất) của mỗi báo: đọc mỗi 5 phút
category_feed_interval_seconds: 1800  # các feed chuyên mục: chỉ là lưới an toàn, đọc mỗi 30 phút
recheck_after_hours: [1, 6, 24]    # tải lại bài sau 1, 6, 24 giờ để phát hiện sửa/gỡ
request_timeout: 20
max_retries: 3
retry_delays_seconds: [60, 300, 1800]
min_words: 50                      # nội dung ngắn hơn thì đánh dấu parse_ok = false
fsync: false                       # true = an toàn hơn khi mất điện, chậm hơn

# Khi máy tắt lâu hơn ngưỡng này, lúc chạy lại sẽ lấy bài của những ngày bị lỡ
# từ sitemap / trang lưu trữ.
gap_fill: true
gap_threshold_minutes: 30

# Báo chưa có bài nào trong State DB (mới thêm): lần đọc RSS đầu chỉ lấy bài đăng trong
# chừng này giờ, để không tải dồn hàng trăm bài một lúc (Dân trí đã chặn IP vì việc này).
warm_start_hours: 3

backfill:
  enabled: false                   # bật sau khi phần lấy bài mới đã chạy ổn
  until: 2026-05-08                # crawl ngược về đến ngày này (6 tháng)
  max_pending: 200                 # số URL crawl ngược tối đa nằm chờ trong hàng đợi mỗi báo

sources:
  vnexpress:
    domain: vnexpress.net
    id_pattern: '-(\d+)\.html$'
    parser: vnexpress
    rate_limit: 1.0                # request/giây, tổng cho báo này
    backfill_rate: 0.5             # request/giây dành cho crawl ngược
    feeds:
      - https://vnexpress.net/rss/tin-moi-nhat.rss
      - https://vnexpress.net/rss/thoi-su.rss
      - https://vnexpress.net/rss/the-gioi.rss
      - https://vnexpress.net/rss/kinh-doanh.rss
      - https://vnexpress.net/rss/phap-luat.rss
      - https://vnexpress.net/rss/giao-duc.rss
      - https://vnexpress.net/rss/suc-khoe.rss
      - https://vnexpress.net/rss/the-thao.rss
      - https://vnexpress.net/rss/giai-tri.rss
      - https://vnexpress.net/rss/khoa-hoc-cong-nghe.rss
    backfill:
      # Sitemap theo ngày của VnExpress chuyển hướng về trang chủ, nên dùng
      # trang lưu trữ theo ngày của từng chuyên mục.
      method: vnexpress_day_archive
      # Chỉ 1001005 (Thời sự) đã được kiểm tra. Các mã còn lại lấy từ trí nhớ:
      # mở https://vnexpress.net/category/day/cateid/<mã>/fromdate/<ts>/todate/<ts>/allcate/<mã>
      # để kiểm tra trước khi bật crawl ngược.
      category_ids: [1001005, 1001002, 1003159, 1001007, 1003497, 1003750, 1002565, 1002691, 1001009]

  tuoitre:
    domain: tuoitre.vn
    id_pattern: '-(\d+)\.htm$'
    parser: tuoitre
    rate_limit: 1.0
    backfill_rate: 0.5
    feeds:
      - https://tuoitre.vn/home.rss
      - https://tuoitre.vn/thoi-su.rss
      - https://tuoitre.vn/the-gioi.rss
      - https://tuoitre.vn/phap-luat.rss
      - https://tuoitre.vn/kinh-doanh.rss
      - https://tuoitre.vn/giao-duc.rss
      - https://tuoitre.vn/suc-khoe.rss
      - https://tuoitre.vn/the-thao.rss
      - https://tuoitre.vn/giai-tri.rss
      - https://tuoitre.vn/nhip-song-so.rss
    backfill:
      method: tuoitre_static_sitemap   # /StaticSitemaps/sitemaps-YYYY-M-a-b.xml, 5 ngày một file

  dantri:
    # Tắt từ 10/11/2026: Dân trí chặn IP server sau lần tải dồn đầu tiên.
    # Khi kiểm tra thấy server kết nối lại được (curl https://dantri.com.vn/) thì bật lại.
    enabled: false
    domain: dantri.com.vn
    id_pattern: '-(\d+)\.htm$'
    parser: dantri
    # 10/11/2026: không kết nối được tới Dân trí cả buổi sáng (nghi bị chặn IP). Giảm tốc cho an toàn.
    rate_limit: 0.5
    backfill_rate: 0.25
    feeds:
      - https://dantri.com.vn/rss/home.rss
      - https://dantri.com.vn/rss/thoi-su.rss
      - https://dantri.com.vn/rss/the-gioi.rss
      - https://dantri.com.vn/rss/kinh-doanh.rss
      - https://dantri.com.vn/rss/phap-luat.rss
      - https://dantri.com.vn/rss/giao-duc.rss
      - https://dantri.com.vn/rss/suc-khoe.rss
      - https://dantri.com.vn/rss/the-thao.rss
      - https://dantri.com.vn/rss/giai-tri.rss
      - https://dantri.com.vn/rss/cong-nghe.rss
    backfill:
      method: dantri_monthly_sitemap   # /sitemaps/Article-YYYY-MM-01.xml

  # ---------- Thêm ngày 10/11/2026 (khảo sát bằng trình duyệt cùng ngày) ----------
  # Báo mới chạy chậm hơn (0,5 request/giây) và khởi động nhẹ (warm_start_hours).

  thanhnien:
    domain: thanhnien.vn
    id_pattern: '-(\d+)\.htm$'
    parser: thanhnien
    rate_limit: 0.5
    backfill_rate: 0.25
    feeds:
      - https://thanhnien.vn/rss/home.rss          # 60 bài, ~2,5 giờ
      - https://thanhnien.vn/rss/thoi-su.rss
      - https://thanhnien.vn/rss/chinh-tri.rss
      - https://thanhnien.vn/rss/thoi-su/phap-luat.rss
    backfill:
      method: fiveday_sitemap                      # cùng nền tảng với Tuổi Trẻ
      url_template: https://thanhnien.vn/sitemaps/sitemaps-{year}-{month}-{a}-{b}.xml

  vietnamnet:
    domain: vietnamnet.vn
    id_pattern: '-(\d+)\.html$'
    parser: vietnamnet
    rate_limit: 0.5
    backfill_rate: 0.25
    # RSS của VietnamNet chứa 1.000 bài (~1 MB mỗi lần đọc): dùng Google News sitemap
    # (~460 bài trong 2 ngày, ~185 KB) và đọc mỗi 15 phút.
    feed_interval_seconds: 900
    feeds:
      - https://vietnamnet.vn/sitemap-news.xml
    backfill:
      method: index_monthly_lastmod                # sitemap-article-MM-YYYY-NN.xml, lọc theo lastmod
      index_url: https://vietnamnet.vn/sitemap.xml
      url_template: https://vietnamnet.vn/sitemap-article-{mm}-{year}-

  nhandan:
    domain: nhandan.vn
    id_pattern: 'post(\d+)\.html$'
    parser: nhandan
    rate_limit: 0.5
    backfill_rate: 0.25
    feeds:
      - https://nhandan.vn/rss/home.rss            # 50 bài, ~6 giờ
    backfill:
      method: monthly_sitemap_lastmod
      url_template: https://nhandan.vn/sitemaps/news-{year}-{month}.xml

  vietnamplus:
    domain: vietnamplus.vn
    host: www.vietnamplus.vn                       # trang dùng www.
    id_pattern: 'post(\d+)\.vnp$'
    parser: vietnamplus
    rate_limit: 0.5
    backfill_rate: 0.25
    feeds:
      - https://www.vietnamplus.vn/rss/home.rss    # 50 bài, ~3,5 giờ
      - https://www.vietnamplus.vn/rss/chinhtri-291.rss
      - https://www.vietnamplus.vn/rss/thegioi-209.rss
      - https://www.vietnamplus.vn/rss/kinhte-311.rss
    backfill:
      method: monthly_sitemap_lastmod
      url_template: https://www.vietnamplus.vn/sitemaps/news-{year}-{month}.xml

  tienphong:
    domain: tienphong.vn
    id_pattern: 'post(\d+)\.tpo$'
    parser: tienphong
    rate_limit: 0.5
    backfill_rate: 0.25
    feeds:
      - https://tienphong.vn/rss/home.rss          # 50 bài, ~2,7 giờ
    backfill:
      method: monthly_sitemap_lastmod              # file tháng ~9 MB, tải một lần rồi giữ trong bộ nhớ
      url_template: https://tienphong.vn/sitemaps/news-{year}-{month}.xml

  vtcnews:
    domain: vtcnews.vn
    id_pattern: 'ar(\d+)\.html$'
    parser: vtcnews
    rate_limit: 0.5
    backfill_rate: 0.25
    feeds:
      - https://vtcnews.vn/rss/tin-moi-nhat.rss    # 100 bài, ~17 giờ
      - https://vtcnews.vn/rss/thoi-su.rss
      - https://vtcnews.vn/rss/kinh-te.rss
      - https://vtcnews.vn/rss/the-gioi.rss
      - https://vtcnews.vn/rss/phap-luat.rss
    backfill:
      method: daily_sitemap
      url_template: https://vtcnews.vn/sitemap-article-{year}-{mm}-{dd}.xml

  laodong:
    # Tắt từ 10/11/2026: từ server, RSS chỉ trả về 177 byte (trình duyệt nhận 60 KB),
    # nghi là trang chống bot. Không vượt qua; bật lại nếu server nhận được RSS đầy đủ.
    enabled: false
    domain: laodong.vn
    id_pattern: '-(\d+)\.ldo$'
    parser: laodong
    rate_limit: 0.5
    backfill_rate: 0.25
    feeds:
      - https://laodong.vn/rss/home.rss            # 40 bài, chỉ ~1,5 giờ: đừng tắt crawler lâu
      - https://laodong.vn/rss/thoi-su.rss
      - https://laodong.vn/rss/the-gioi.rss
      - https://laodong.vn/rss/xa-hoi.rss
      - https://laodong.vn/rss/phap-luat.rss
      - https://laodong.vn/rss/kinh-doanh.rss
    # Sitemap của Lao Động chia theo chuyên mục, không theo ngày: chưa hỗ trợ crawl ngược
    # và lấp khoảng trống.

  sggp:
    domain: sggp.org.vn
    host: www.sggp.org.vn                          # trang dùng www.; một số bài chuyển sang thethao.sggp.org.vn
    id_pattern: 'post(\d+)\.html$'
    parser: sggp
    rate_limit: 0.5
    backfill_rate: 0.25
    feeds:
      - https://www.sggp.org.vn/rss/home.rss       # 50 bài, ~5 giờ
      - https://www.sggp.org.vn/rss/chinh-tri-24.rss
      - https://www.sggp.org.vn/rss/xa-hoi-199.rss
    backfill:
      method: monthly_sitemap_lastmod              # nền tảng như Nhân Dân
      url_template: https://www.sggp.org.vn/sitemaps/news-{year}-{month}.xml

  vov:
    domain: vov.vn
    id_pattern: 'post(\d+)\.vov$'
    parser: vov
    # robots.txt của VOV yêu cầu Crawl-delay: 20 (mỗi request cách nhau 20 giây);
    # crawler tự áp dụng khi đọc robots.txt, đặt sẵn ở đây cho rõ.
    rate_limit: 0.05
    backfill_rate: 0.05
    feed_interval_seconds: 900                     # RSS ~400 KB cho 30 bài (~2 giờ): đọc mỗi 15 phút
    feeds:
      - https://vov.vn/rss.xml
    # Sitemap của VOV không chia theo ngày: chưa hỗ trợ crawl ngược và lấp khoảng trống.
